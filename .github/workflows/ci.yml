name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: 🔍 Verify
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type-check and validate templates
        run: npm run check

      - name: Build
        env:
          # Lifts the unauthenticated GitHub API rate limit for the build-time
          # release fetch. Read-only, and it never reaches the client bundle.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Verify the build produced both locales
        run: |
          missing=0
          for f in dist/index.html dist/es/index.html dist/sitemap-index.xml; do
            if [ ! -f "$f" ]; then
              echo "::error::expected build output missing: $f"
              missing=1
            fi
          done
          exit $missing

      - name: Verify no build-time secret leaked into the client bundle
        run: |
          # ghs_ is the prefix Actions' own GITHUB_TOKEN uses (a GitHub App
          # installation token) — the one thing this step exists to catch.
          # ghp_/gho_/ghu_/ghr_/github_pat_ cover the other GitHub formats,
          # AKIA covers an AWS key pasted in by accident.
          if grep -rIlE 'gh[pousr]_[A-Za-z0-9]{16,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}' dist/ 2>/dev/null; then
            echo "::error::credential-shaped string found in the built output"
            exit 1
          fi
          echo "No token material found in dist/"

      - name: Verify the Content-Security-Policy
        run: npm run check:csp

      - name: Verify the client bundle carries no authenticated request
        run: |
          # The build may read GITHUB_TOKEN; the browser must never. This
          # catches the token-bearing code path surviving into the client
          # bundle even when the token value itself is absent at build time.
          if grep -rIl -e 'GITHUB_TOKEN' -e 'Authorization' -e 'process.env' dist/ 2>/dev/null; then
            echo "::error::client output references an authenticated request path"
            exit 1
          fi
          echo "Client bundle makes only unauthenticated requests"
