name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Checks daily whether a tracked repo has shipped. Only builds and deploys
  # when it has — see the `check` job.
  schedule:
    - cron: '17 6 * * *'

# Allow one concurrent deployment; never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # A scheduled rebuild is an unattended deploy, and doing one every day is a
  # daily chance to publish a regression for a page that usually has not
  # changed. So the schedule only *checks*: it compares the live site against
  # the GitHub API and stops here when they already agree. Pushes and manual
  # runs always proceed.
  check:
    name: 🔎 Anything to publish?
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.upstream.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the live site against upstream releases
        id: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: https://sherrerapiqueras.github.io/
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "${{ github.event_name }}: building unconditionally"
            exit 0
          fi
          node scripts/check-upstream.mjs

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type-check and validate templates
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      # A broken CSP hash would ship a page whose theme script the browser
      # refuses to run, so this gates the deploy rather than only the PR.
      - name: Verify the Content-Security-Policy
        run: npm run check:csp

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # Gates publishing: the build artifact is already uploaded, but nothing is
  # deployed until the real page passes its journeys and the axe audit.
  e2e:
    name: 🎭 End-to-end
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end and accessibility tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-deploy
          path: playwright-report/
          retention-days: 7

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [build, e2e]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
