name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Checks daily whether a tracked repo has shipped. Only builds and deploys
  # when it has — see the `check` job.
  schedule:
    - cron: '17 6 * * *'

# Allow one concurrent deployment; never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # A scheduled rebuild is an unattended deploy, and doing one every day is a
  # daily chance to publish a regression for a page that usually has not
  # changed. So the schedule only *checks*: it compares the live site against
  # the GitHub API and stops here when they already agree. Pushes and manual
  # runs always proceed.
  check:
    name: 🔎 Anything to publish?
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.upstream.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Compare the live site against upstream releases
        id: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: https://sherrerapiqueras.github.io/
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "${{ github.event_name }}: building unconditionally"
            exit 0
          fi
          node scripts/check-upstream.mjs

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type-check and validate templates
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      # A broken CSP hash would ship a page whose theme script the browser
      # refuses to run, so this gates the deploy rather than only the PR.
      - name: Verify the Content-Security-Policy
        run: npm run check:csp

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
